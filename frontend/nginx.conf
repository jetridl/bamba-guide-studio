# cloudflared terminates public HTTPS, then connects over host loopback HTTP.
# The production origin is private; do not expose it to untrusted direct clients.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}

# Refresh Docker DNS when the backend container is replaced during an update.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream studio_backend {
    zone studio_backend 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Guide JSON imports can be large.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://studio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/guides/..., /journeys/...) fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
