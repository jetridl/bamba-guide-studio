name: Studio checks and deployment

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend and deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bamba
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bamba_guide_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bamba -d bamba_guide_studio"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://bamba:ci-only-password@localhost:5432/bamba_guide_studio
      CONTENT_SYNC_ENABLED: 'false'
      LOAD_PUBLISHED_GUIDES: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: ruff check . ../tests
      - name: Apply migrations to PostgreSQL
        run: alembic upgrade head
      - run: python -m pytest -q tests ../tests
      - name: Check deployment script syntax
        run: bash -n ../scripts/build-production.sh ../scripts/deploy-production.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to Hetzner
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.STUDIO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://studio.bambapoetry.app
    concurrency:
      group: studio-production
      cancel-in-progress: false
    env:
      RELEASE_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and package AMD64 images
        run: bash scripts/build-production.sh "$RELEASE_TAG"
      - name: Skip a release superseded on master
        id: current_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          if [[ "$head_commit" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Skipped: a newer commit is already on master.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Transfer and deploy release
        if: steps.current_release.outputs.deploy == 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/studio_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/studio_known_hosts"
          trap 'rm -f "$HOME/.ssh/studio_deploy" "$HOME/.ssh/studio_known_hosts"' EXIT
          ssh-keygen -y -P '' -f "$HOME/.ssh/studio_deploy" > /dev/null
          ssh_options=(-i "$HOME/.ssh/studio_deploy" -o IdentitiesOnly=yes
            -o BatchMode=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/studio_known_hosts"
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" 'mkdir -p -m 700 studio-releases'
          scp "${ssh_options[@]}" -r "output/deploy/$RELEASE_TAG" "$SSH_USER@$SSH_HOST:studio-releases/"
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "bash studio-releases/$RELEASE_TAG/deploy-production.sh studio-releases/$RELEASE_TAG"
          printf 'Deployed `%s` to [Studio](https://studio.bambapoetry.app).\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
