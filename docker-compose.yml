name: bamba-guide-studio

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bamba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bamba}
      POSTGRES_DB: ${POSTGRES_DB:-bamba_guide_studio}
    # No host port: only the backend reaches the database. For local development,
    # add docker-compose.dev.yml to publish it on 127.0.0.1 (see README).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bamba}:${POSTGRES_PASSWORD:-bamba}@postgres:5432/${POSTGRES_DB:-bamba_guide_studio}
    # Publish writes into the bind mounts below, so run as the owner of this checkout.
    # Docker Desktop on macOS maps any user; on Linux set STUDIO_UID/STUDIO_GID to `id -u`/`id -g`.
    user: "${STUDIO_UID:-1000}:${STUDIO_GID:-1000}"
    volumes:
      # Startup loads approved guides from exports/; Publish writes them there
      # and links each one from guides/json/.
      - ./exports:/srv/exports
      - ./guides:/srv/guides
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: frontend
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
